<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consensus / Polymarket Top-Trader Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D10;
    --panel: #14171A;
    --panel-border: #24272B;
    --text: #E8E6E1;
    --text-dim: #8B8D90;
    --amber: #E8A33D;
    --amber-dim: #7A5A28;
    --red: #C1554B;
    --green: #6B9E78;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px;
  }

  .mono { font-family: 'IBM Plex Mono', monospace; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  h1 .accent { color: var(--amber); }

  .status-bar {
    display: flex;
    gap: 28px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-bar .value {
    color: var(--text);
    font-weight: 500;
  }

  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
    vertical-align: middle;
  }
  .status-dot.stale { background: var(--red); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    overflow: hidden;
  }

  .panel-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--panel-border);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
  }

  table { width: 100%; border-collapse: collapse; }

  th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    padding: 10px 18px;
    border-bottom: 1px solid var(--panel-border);
    font-weight: 500;
  }

  td {
    padding: 14px 18px;
    border-bottom: 1px solid var(--panel-border);
    font-size: 14px;
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .market-q { max-width: 360px; }
  .outcome-tag {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid var(--amber-dim);
    border-radius: 3px;
    color: var(--amber);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }

  .meter { display: flex; align-items: center; gap: 8px; }
  .dots { display: flex; gap: 3px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--panel-border);
  }
  .dot.filled { background: var(--amber); }
  .meter-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    min-width: 42px;
  }

  .size {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text);
  }

  .empty-state {
    padding: 48px 18px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }
  .empty-state .mono { display: block; margin-top: 8px; font-size: 12px; opacity: 0.7; }

  .cat-filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .cat-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    cursor: pointer;
    background: transparent;
    text-transform: none;
    user-select: none;
  }
  .cat-chip:hover { border-color: var(--amber-dim); color: var(--text); }
  .cat-chip.active {
    background: var(--amber);
    border-color: var(--amber);
    color: #14171A;
    font-weight: 600;
  }

  .category-cell { color: var(--text-dim); font-size: 12px; font-family: 'IBM Plex Mono', monospace; }

  .footer-note {
    margin-top: 20px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>

<header>
  <h1>CONSENSUS<span class="accent">/</span><span class="mono" style="font-weight:400; font-size:14px; color: var(--text-dim);">polymarket top-trader monitor</span></h1>
  <div class="status-bar">
    <div><span class="status-dot" id="status-dot"></span><span id="status-text">connecting</span></div>
    <div>TRACKED <span class="value mono" id="tracked-count">—</span></div>
    <div>THRESHOLD <span class="value mono" id="threshold">—</span></div>
    <div>UPDATED <span class="value mono" id="updated-at">—</span></div>
  </div>
</header>

<div class="panel">
  <div class="panel-head" style="display:flex; justify-content:space-between; align-items:center;">
    <span>Active consensus signals</span>
    <div class="cat-filters" id="cat-filters"></div>
  </div>
  <table id="signal-table">
    <thead>
      <tr>
        <th style="width: 34%;">Market</th>
        <th>Category</th>
        <th>Outcome</th>
        <th>Agreement</th>
        <th style="text-align:right;">Aggregate size</th>
      </tr>
    </thead>
    <tbody id="signal-rows"></tbody>
  </table>
  <div class="empty-state" id="empty-state" style="display:none;">
    No markets currently cross the consensus threshold.
    <span class="mono">Signals appear here once enough tracked wallets agree on the same side.</span>
  </div>
</div>

<div class="footer-note" id="error-note"></div>

<script>
  const REFRESH_MS = 15000;
  let activeCategory = null; // null = show all
  let latestData = null;

  function timeAgo(ts) {
    if (!ts) return "—";
    const diff = Math.floor(Date.now() / 1000 - ts);
    if (diff < 60) return diff + "s ago";
    if (diff < 3600) return Math.floor(diff / 60) + "m ago";
    return Math.floor(diff / 3600) + "h ago";
  }

  function renderDots(count, total) {
    const capped = Math.min(total, 10); // cap visual dots at 10 for readability
    const filledDots = Math.round((count / total) * capped);
    let html = '<div class="dots">';
    for (let i = 0; i < capped; i++) {
      html += `<div class="dot ${i < filledDots ? 'filled' : ''}"></div>`;
    }
    html += '</div>';
    return html;
  }

  function renderCategoryFilters(categories) {
    const container = document.getElementById('cat-filters');
    const chips = ['All', ...categories].map(cat => {
      const isAll = cat === 'All';
      const isActive = isAll ? activeCategory === null : activeCategory === cat;
      return `<span class="cat-chip ${isActive ? 'active' : ''}" data-cat="${isAll ? '' : escapeHtml(cat)}">${escapeHtml(cat)}</span>`;
    }).join('');
    container.innerHTML = chips;

    container.querySelectorAll('.cat-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const cat = chip.getAttribute('data-cat');
        activeCategory = cat === '' ? null : cat;
        renderTable();
        renderCategoryFilters(categories);
      });
    });
  }

  function renderTable() {
    if (!latestData) return;
    const rows = document.getElementById('signal-rows');
    const emptyState = document.getElementById('empty-state');

    let signals = latestData.signals || [];
    if (activeCategory) {
      signals = signals.filter(s => s.category === activeCategory);
    }

    if (signals.length === 0) {
      rows.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    rows.innerHTML = signals.map(s => `
      <tr>
        <td class="market-q">${escapeHtml(s.market_question)}</td>
        <td class="category-cell">${escapeHtml(s.category || 'Uncategorized')}</td>
        <td><span class="outcome-tag">${escapeHtml(s.outcome)}</span></td>
        <td>
          <div class="meter">
            ${renderDots(s.agree_count, s.total_tracked)}
            <span class="meter-count">${s.agree_count}/${s.total_tracked}</span>
          </div>
        </td>
        <td style="text-align:right;" class="size">$${Number(s.total_size_usd).toLocaleString()}</td>
      </tr>
    `).join('');
  }

  async function refresh() {
    try {
      const res = await fetch('/api/consensus');
      const data = await res.json();
      latestData = data;

      document.getElementById('tracked-count').textContent = data.tracked_wallets || '—';
      document.getElementById('updated-at').textContent = timeAgo(data.updated_at);
      document.getElementById('threshold').textContent = data.signals.length
        ? '≥' + Math.min(...data.signals.map(s => s.agree_count))
        : '—';

      const dot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const errorNote = document.getElementById('error-note');

      if (data.error) {
        dot.classList.add('stale');
        statusText.textContent = 'error';
        errorNote.textContent = 'Last error: ' + data.error;
      } else {
        dot.classList.remove('stale');
        statusText.textContent = 'live';
        errorNote.textContent = '';
      }

      renderCategoryFilters(data.categories || []);
      renderTable();
    } catch (e) {
      document.getElementById('status-dot').classList.add('stale');
      document.getElementById('status-text').textContent = 'disconnected';
      document.getElementById('error-note').textContent = 'Could not reach backend: ' + e;
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>

</body>
</html>
